name: Weekly invite & stats refresh
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-check every invite (public Discord invite preview, no login)
        run: REFRESH_BUDGET_SECONDS=3600 python3 scripts/refresh.py
      - name: Commit if anything changed
        run: |
          git config user.name "refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/communities.json
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: weekly refresh of member counts and invite status"
          git push
