name: Daily link & stats refresh (rolling slice)
on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC; each run re-checks the 250 least-recently-checked entries, so every entry is checked every few days
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-check every invite (public Discord invite preview, no login)
        run: REFRESH_LIMIT=250 REFRESH_BUDGET_SECONDS=3000 python3 scripts/refresh.py
      - name: Commit if anything changed
        run: |
          git config user.name "refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/communities.json
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: daily refresh slice (member counts, link status)"
          git push
