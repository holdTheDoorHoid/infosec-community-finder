name: Report a dead link or wrong info
description: An invite is dead, a server changed, or a description is wrong
title: "[Fix] <server name>"
labels: ["fix"]
body:
  - type: input
    id: name
    attributes: { label: Server name (as shown on the site) }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What is wrong and what should it say? }
    validations: { required: true }
